name: bharat_railway_frontend
description: "Bharat Railway Booking System - Frontend Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # UI Icons
  cupertino_icons: ^1.0.8

  # State Management
  provider: ^6.1.1

  # HTTP Client
  dio: ^5.4.0

  # Local Storage
  shared_preferences: ^2.2.2

  # PDF Generation
  pdf: ^3.10.4
  printing: ^5.11.1

  # File & Share
  path_provider: ^2.1.3
  share_plus: ^7.2.1

  # Payment Gateway
  razorpay_flutter: ^1.3.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Assets
  assets:
    - assets/images/